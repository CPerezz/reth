name: Build and push reth Docker image (per-commit)

# Auto-tag every push to the skip-genesis-validation branch with the commit SHA.
# Lets state-actor pin to ghcr.io/CPerezz/reth:<sha> while the upstream PR is in
# review. The workflow lives on the feature branch only — drops cleanly when the
# branch is merged or deleted.
#
# Required setup (one-time, on the CPerezz/reth fork):
#   1. Settings → Actions → General → "Workflow permissions" → "Read and write"
#      (or grant `packages: write` per-workflow as below).
#   2. The default GITHUB_TOKEN is sufficient for pushing to ghcr.io under the
#      same owner as the repo; no extra secret needed.

on:
  push:
    branches:
      - skip-genesis-validation
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects mixed-case image names; normalize the repo owner to
      # lowercase so the tags are always valid regardless of how the fork
      # owner spells their handle.
      - name: Compute lowercased image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/reth" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reth image (tagged with commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Build with --profile release so the linker peak fits in GHA's
          # ~7 GB runner RAM. maxperf (default) needs more.
          build-args: |
            BUILD_PROFILE=release
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:skip-genesis-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # state-actor pulls amd64 in Docker Desktop linux/amd64 emulation;
          # build only that for now to keep CI time bounded. Add arm64 later
          # if state-actor needs native Apple Silicon images.
          platforms: linux/amd64
